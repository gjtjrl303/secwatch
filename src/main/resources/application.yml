spring:
  datasource:
    # 기본값은 docker-compose.yml 의 MySQL(호스트 3307). 다른 DB를 쓰려면 DB_URL, DB_USERNAME, DB_PASSWORD 환경변수로 바꾼다.
    url: ${DB_URL:jdbc:mysql://localhost:3307/secwatch}
    username: ${DB_USERNAME:secwatch}
    password: ${DB_PASSWORD:secwatch}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # 화면의 안내 문구(20MB)와 ErrorCode.FILE_TOO_LARGE 문구와 같이 바꾼다.
      max-file-size: 20MB
      max-request-size: 25MB
server:
  tomcat:
    # 실제 package-lock.json은 Tomcat 기본 폼 한도(2MB)를 자주 넘는다.
    max-http-form-post-size: 20MB
    # 한도를 넘는 업로드를 끝까지 읽어야 연결이 끊기지 않고 안내 화면이 나간다. 이보다 큰 요청은 연결을 끊는다.
    max-swallow-size: 50MB
secwatch:
  recheck:
    # 매일 재점검 시각(초 분 시 일 월 요일, Asia/Seoul 기준). "-"로 두면 끈다.
    cron: "0 0 9 * * *"
