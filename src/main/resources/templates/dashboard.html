<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>secwatch</title>
    <th:block th:replace="~{fragments/side :: head}"></th:block>
</head>
<body>
<div class="app">
<nav th:replace="~{fragments/side :: side('list')}"></nav>
<main>
    <header class="top">
        <div>
            <p class="crumb">라이브러리 취약점과 사이트 점검</p>
            <h1>secwatch</h1>
        </div>
        <a class="button primary" th:href="@{/projects/new}">새 프로젝트 등록</a>
    </header>
    <p th:if="${rows.empty}" class="panel muted">등록된 프로젝트가 없습니다.</p>
    <div class="table-scroll tbl" th:unless="${rows.empty}">
    <table>
        <thead><tr><th>프로젝트</th><th>도메인</th><th>열린 취약점</th></tr></thead>
        <tbody>
        <tr class="project-row" th:each="r : ${rows}">
            <td><a th:href="@{/projects/{id}(id=${r.id})}" th:text="${r.name}"></a></td>
            <td class="domain" th:text="${r.domain}"></td>
            <td>
                <span th:if="${r.counts.empty}" class="muted">없음</span>
                <span th:each="c : ${r.counts}" th:class="'badge sev-' + ${#strings.toLowerCase(c.severity)}" th:text="${c.text}"></span>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</div>
</body>
</html>
